<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nordram link preview</title>
<!--
  The link-preview card (og:image) for both home pages, 1200 x 630.
  _og/render.sh screenshots it with headless Chrome into og-hy.png and
  og-en.png at the repository root: #hy and #en pick the language. Jekyll
  does not publish "_" folders, so this page never reaches the site.

  Same ground, colours and fonts as the home pages (their :root tokens);
  the headline is each page's own h1, word for word. Change it here when
  the h1 changes, then run the script again.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600&family=Noto+Sans+Armenian:wght@600&display=block" rel="stylesheet">
<style>
  :root {
    --canvas: #060b0d;
    --text:   #EFEFF3;
    --text-2: #A8A8B4;
    --display: "Outfit", "Noto Sans Armenian", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    background-color: var(--canvas);
    /* The site's ocean halo, scaled to the card. */
    background-image: radial-gradient(1000px 600px at 74% -120px, rgba(60,190,210,.09), rgba(60,190,210,0) 70%);
    background-repeat: no-repeat;
    -webkit-font-smoothing: antialiased;
  }
  .card {
    width: 1200px; height: 630px; padding: 84px 88px 92px;
    display: flex; flex-direction: column; justify-content: space-between;
    visibility: hidden;
  }
  .ready .card { visibility: visible; }
  .card svg { display: block; align-self: flex-start; height: 56px; width: auto; }
  h1 {
    margin: 0; font-family: var(--display); font-weight: 600; color: var(--text);
    font-size: 100px; line-height: 1; letter-spacing: -.04em;
  }
  h1 .second { color: var(--text-2); }
  /* As on the Armenian page: Noto Sans Armenian runs longer and sits taller. */
  :lang(hy) h1 { font-size: 84px; line-height: 1.08; letter-spacing: -.025em; }
</style>
</head>

  <h1 id="headline"></h1>
</div>
<script>
  // The headline of each home page, as it stands in its h1.
  var lines = {
    hy: ['Ձեր բոլոր ֆինանսների', 'իրական վերլուծություն։'],
    en: ['Real analytics', 'on all your money.']
  };
  var lang = location.hash === '#en' ? 'en' : 'hy';
  document.documentElement.lang = lang;
  var h = document.getElementById('headline');
  h.appendChild(document.createTextNode(lines[lang][0]));
  h.appendChild(document.createElement('br'));
  var second = document.createElement('span');
  second.className = 'second';
  second.textContent = lines[lang][1];
  h.appendChild(second);
  // Show the card only once both fonts are in, so a capture can never hold a
  // fallback face or an empty box.
  Promise.all([
    document.fonts.load('600 100px Outfit', 'Ra'),
    document.fonts.load('600 84px "Noto Sans Armenian"', 'Ձ')
  ]).then(function () { return document.fonts.ready; })
    .then(function () { document.documentElement.classList.add('ready'); });
</script>

</html>
